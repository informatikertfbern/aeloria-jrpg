function drawMenu(){ctx.fillStyle='rgba(0,0,20,.88)';ctx.fillRect(0,0,W,H);panel(60,40,W-120,H-80);ctx.fillStyle='#fc6';ctx.font='bold 20px Courier New';ctx.fillText('PAUSE - Aeloria',80,70);ctx.fillStyle='#aaa';ctx.font='13px Courier New';ctx.fillText('Gold: '+P.gold+'  .  '+M[P.map].name,80,92);if(menu.mode==='main'){['Weiter','Item','Mitglieder','Speichern','Laden','Titel'].forEach(function(o,i){ctx.fillStyle=menu.i===i?'#fc6':'#fff';ctx.font=(menu.i===i?'bold ':'')+'16px Courier New';ctx.fillText((menu.i===i?'> ':'  ')+o,100,130+i*24)})}else if(menu.mode==='item'){var o=Object.keys(P.inv).filter(function(x){return P.inv[x]>0});if(!o.length){ctx.fillStyle='#888';ctx.fillText('(Keine Items)',100,130)}o.forEach(function(n,i){ctx.fillStyle=menu.i===i?'#fc6':'#fff';ctx.font=(menu.i===i?'bold ':'')+'15px Courier New';ctx.fillText((menu.i===i?'> ':'  ')+n+' x'+P.inv[n],100,130+i*22)});if(o[menu.i]){ctx.fillStyle='#aaa';ctx.font='13px Courier New';ctx.fillText(ITEMS[o[menu.i]].d,360,130)}ctx.fillStyle='#888';ctx.font='11px Courier New';ctx.fillText('E=Benutzen . Esc=Zurueck',80,H-60)}else if(menu.mode==='tgt'){ctx.fillStyle='#fc6';ctx.fillText('Ziel fuer '+menu.it+':',100,130);P.mem.forEach(function(m,i){ctx.fillStyle=menu.i===i?'#fc6':'#fff';ctx.font=(menu.i===i?'bold ':'')+'15px Courier New';ctx.fillText((menu.i===i?'> ':'  ')+m.n+' HP '+m.hp+'/'+m.mhp+(m.alive?'':' [gefallen]'),100,160+i*22)});ctx.fillStyle='#888';ctx.font='11px Courier New';ctx.fillText('E=Benutzen . Esc=Zurueck',80,H-60)}else if(menu.mode==='mem'){P.mem.forEach(function(m,i){var y=130+i*90;ctx.fillStyle='#fc6';ctx.font='bold 16px Courier New';ctx.fillText(m.n+'  Lv.'+m.lv,100,y);ctx.fillStyle='#fff';ctx.font='13px Courier New';ctx.fillText('HP '+m.hp+'/'+m.mhp+'  MP '+m.mp+'/'+m.mmp+'  ATK '+m.atk+'  DEF '+m.def+'  AGI '+m.agi,120,y+20);ctx.fillText('EP '+m.xp+'/'+m.xn+'   Skills: '+(m.sk.length?m.sk.map(function(s){return SK[s].n}).join(', '):'(keine)'),120,y+38)});ctx.fillStyle='#888';ctx.font='11px Courier New';ctx.fillText('Esc=Zurueck',80,H-60)}else if(menu.mode==='save'||menu.mode==='load'){ctx.fillStyle='#fc6';ctx.font='bold 16px Courier New';ctx.fillText(menu.mode==='save'?'Speichern:':'Laden:',100,120);for(var i=0;i<3;i++){var d=load(i);ctx.fillStyle=menu.i===i?'#fc6':'#fff';ctx.font=(menu.i===i?'bold ':'')+'15px Courier New';ctx.fillText((menu.i===i?'> ':'  ')+'Slot '+(i+1)+': '+(d?new Date(d.t).toLocaleString()+' | Lv'+d.mem[0].lv:'(leer)'),100,150+i*22)}ctx.fillStyle=menu.i===3?'#fc6':'#fff';ctx.font=(menu.i===3?'bold ':'')+'15px Courier New';ctx.fillText((menu.i===3?'> ':'  ')+'Abbruch',100,216)}}
function drawTitle(){var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a0a2a');g.addColorStop(1,'#2a0a3a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(var i=0;i<60;i++){ctx.fillStyle='rgba(255,255,255,'+(.3+Math.sin(gt/500+i)*.3)+')';ctx.fillRect((i*97)%W,(i*53+Math.sin(gt/1000+i)*20)%H,2,2)}ctx.textAlign='center';ctx.fillStyle='#fc6';ctx.font='bold 40px Courier New';ctx.fillText('CHRONIKEN VON',W/2,160);ctx.fillText('AELORIA',W/2,210);ctx.fillStyle='#aaf';ctx.font='16px Courier New';ctx.fillText('Ein Mini-JRPG',W/2,245);ctx.fillStyle='#fff';ctx.font='18px Courier New';ctx.globalAlpha=Math.sin(gt/300)>0?1:.4;ctx.fillText('Druecke ENTER / E zum Starten',W/2,320);ctx.globalAlpha=1;ctx.fillStyle='#888';ctx.font='12px Courier New';ctx.fillText('Bestehender Spielstand (Slot 1) wird geladen, falls vorhanden.',W/2,360);ctx.textAlign='left'}
function drawOver(){ctx.fillStyle='#200';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#f44';ctx.font='bold 48px Courier New';ctx.fillText('GAME OVER',W/2,200);ctx.fillStyle='#fff';ctx.font='16px Courier New';ctx.fillText('Druecke ENTER...',W/2,260);ctx.textAlign='left'}
function drawEnd(){var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#2a2a00');g.addColorStop(1,'#554400');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fc6';ctx.font='bold 34px Courier New';ctx.fillText('SIEG!',W/2,140);ctx.fillStyle='#fff';ctx.font='16px Courier New';wrap('Du hast Morvath besiegt und die Kristallkugel zurueckgebracht. Aeloria ist gerettet! Nebelheim feiert dich als Helden.',W/2-220,200,440,24);ctx.fillStyle='#aaa';ctx.font='14px Courier New';ctx.fillText('Druecke ENTER fuer den Titelbildschirm',W/2,360);ctx.textAlign='left'}
var last=0;function loop(t){var dt=t-last;last=t;gt=t;keys();if(state==='world')updW(dt);else if(state==='battle'){if(bat&&bat.dl>0){bat.dl--;if(bat.dl<=0)nextTurn()}}ctx.clearRect(0,0,W,H);if(state==='title')drawTitle();else if(state==='world'||state==='dialog'){drawW();if(state==='dialog')drawDlg()}else if(state==='battle'||state==='bEnd'){if(bat)drawB()}else if(state==='menu'){drawW();drawMenu()}else if(state==='over')drawOver();else if(state==='ending')drawEnd();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
